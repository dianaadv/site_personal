<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Live</title>
    <style>
      /*Stilizează întreaga fereastră pop-up*/
      body {
        /*Culori*/
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #2c3e50; /*Fundal închis*/
        color: #ecf0f1; /*Text deschis*/

        /*Centrare*/
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; /*Ocupă toată înălțimea vizibilă*/
        margin: 0;
        padding: 10px;
      }

      /*Stilizarea elementului audio HTML5*/
      audio {
        /*Aici controlezi dimensiunea*/
        width: 300px;
        /*Culori (limitat) - funcționează mai bine pe Chrome/Edge decât pe Firefox*/
        /*Poți schimba culoarea de accent (slider, buton play) dar nu în toate browserele*/
        /* accent-color: #e74c3c; */
      }
    </style>
  </head>

  <body>
    <audio controls autoplay loop>
      <source src="https://s5.radio.co/sfff7b7e97/listen" type="audio/mpeg" />
      Browserul tău nu suportă redarea audio.
    </audio>

    <script>
      //Script opțional pentru a forța redarea automată (deși browserele o pot bloca)

      document
        .querySelector("audio")
        .play()
        .catch((error) => {
          console.log(
            "Redarea automată a fost blocată. Vă rugăm să apăsați butonul de redare.",
            error
          );
        });
    </script>
  </body>
</html>
