<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poarta Stelelor - Poveste Interactiva</title>
    <style>
      body {
        background: radial-gradient(
          ellipse at center,
          #e8ebf5 0%,
          #1599f2 100%
        );
        color: #42abf5;
        font-family: "Georgia", serif;
        text-align: center;
        margin: 0;
        padding: 0;
        overflow: visible;
        transition: background 2s;
      }

      #stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        pointer-events: none;
        z-index: 0;
      }

      #story-container {
        position: relative;
        z-index: 2;
        padding: 40px;
        max-width: 800px;
        margin: auto;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      img {
        width: 80%;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        transition: transform 1s, box-shadow 1s;
      }

      img:hover {
        transform: scale(1.03);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
      }

      h1 {
        font-size: 2.2em;
        margin-bottom: 20px;
        color: #c7d7ff;
      }

      p {
        font-size: 1.2em;
        line-height: 1.6;
      }

      button {
        background-color: rgba(40, 50, 80, 0.8);
        color: #fff;
        border: none;
        padding: 10px 20px;
        margin: 10px;
        border-radius: 8px;
        font-size: 1em;
        cursor: pointer;
        transition: background 0.3s, transform 0.3s;
      }

      button:hover {
        background-color: rgba(100, 130, 255, 0.9);
        transform: scale(1.05);
      }

      .fade {
        animation: fade 1.5s ease-in-out;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /*Efect de "stele" animate*/
      @keyframes starsMove {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 1000px 1000px;
        }
      }

      #stars::before,
      #stars::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 200%;
        background: transparent
          url("https://www.transparenttextures.com/patterns/stardust.png")
          repeat;
        animation: starsMove 100s linear infinite;
        opacity: 0.4;
      }

      .home-button {
        background: radial-gradient(ellipse at top, #fdf6f0, #f7e8e1);
        margin: 0;
        background: rgba(255, 255, 255, 0.92);
        border: 6px double #d4af37;
        border-radius: 20px;
        padding: 10px 15px;
        position: fixed;
        cursor: pointer;
        top: 60px;
        left: 20px;
        font-size: small;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <nav class="home-button">
      <a href="../../Hoinar_prin_fictiune/index.html"
        >Acasă/HoinarPrinFicțiune</a
      >
    </nav>

    <canvas id="stars"></canvas>

    <div id="story-container" class="fade">
      <h1 id="title"></h1>
      <img id="image" src="" alt="Capitolul imaginii" />
      <p id="text"></p>
      <div id="choices"></div>
    </div>

    <audio id="music" autoplay loop></audio>

    <script src="../povestea_stelelor/script.js"></script>
  </body>
</html>
